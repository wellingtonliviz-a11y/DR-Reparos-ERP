{% extends "base.html" %}

{% block title %}Novo Cliente | DR Reparos ERP{% endblock %}

{% block content %}

<div style="margin-bottom: 15px;">
    <button type="button"
            class="btn-voltar"
            onclick="history.back()">
        ← Voltar
    </button>
</div>

<header class="topo">
    <div>
        <h1>👤 Novo Cliente</h1>
        <p>Cadastre um novo cliente da DR Reparos.</p>
    </div>
</header>

<section class="painel">

    <form method="POST">

        <label>Nome *</label>
        <input
            type="text"
            name="nome"
            placeholder="Nome do cliente"
            required
        >

        <label>Telefone / WhatsApp *</label>
        <input
            type="text"
            name="telefone"
            placeholder="(12) 99999-9999"
            required
        >

        <label>E-mail</label>
        <input
            type="email"
            name="email"
            placeholder="cliente@email.com"
        >

        <label>Endereço</label>
        <input
            type="text"
            name="endereco"
            placeholder="Endereço do atendimento"
        >

        <label>Observações</label>
        <textarea
            name="observacoes"
            placeholder="Informações importantes sobre o cliente"
        ></textarea>

        <button type="submit" class="btn-principal">
            Salvar Cliente
        </button>

    </form>

</section>

{% endblock %}
